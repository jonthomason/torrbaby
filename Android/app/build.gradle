plugins { id 'com.android.application' }
android {
    namespace 'com.torrbaby.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'com.torrbaby.tv'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "com.torrbaby.tv.DiscoveryTestRunner"
        versionCode 115
        versionName '1.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-ui:1.9.3'
    implementation 'androidx.media3:media3-session:1.9.3'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// The relay to bronze (Android/native, Rust over Apple/Direct) for armeabi-v7a and arm64-v8a,
// built into src/main/jniLibs before every build; cargo rebuilds only what changed.
def buildNativeRelay = tasks.register('buildNativeRelay', Exec) {
    def repository = rootProject.projectDir.parentFile
    workingDir repository
    environment 'PATH', System.getProperty('user.home') + '/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:' + System.getenv('PATH')
    commandLine 'bash', new File(repository, 'scripts/build_android_native.sh').path
}
tasks.named('preBuild') { dependsOn buildNativeRelay }
