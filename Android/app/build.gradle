// TVs get the remote's screens (MainActivity and its Java views); phones and tablets the iPhone
// app's (PhoneActivity, Kotlin and Compose). Both share the connection, library and player code.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.torrbaby.tv'
    compileSdk 37
    defaultConfig {
        applicationId 'com.torrbaby.tv'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "com.torrbaby.tv.DiscoveryTestRunner"
        versionCode 127
        versionName '1.0'
    }
    buildFeatures { buildConfig true; compose true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-ui:1.9.3'
    implementation 'androidx.media3:media3-session:1.9.3'
    implementation 'com.google.zxing:core:3.5.3'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// The relay to bronze (Android/native, Rust over Apple/Direct) for armeabi-v7a and arm64-v8a,
// built into src/main/jniLibs before every build; cargo rebuilds only what changed.
def buildNativeRelay = tasks.register('buildNativeRelay', Exec) {
    def repository = rootProject.projectDir.parentFile
    workingDir repository
    environment 'PATH', System.getProperty('user.home') + '/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:' + System.getenv('PATH')
    commandLine 'bash', new File(repository, 'scripts/build_android_native.sh').path
}
tasks.named('preBuild') { dependsOn buildNativeRelay }
