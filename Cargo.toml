[package]
name = "torrbaby"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A standalone private media server and Transmission manager"

[[bin]]
name = "torrbaby"
path = "server/main.rs"

[profile.release]
lto = "thin"
# Symbols stay, so a sample of a stuck server (the watchdog's, in hangs/) names the code.
strip = false

[dependencies]
futures-util = "0.3.34"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
ring = "0.17"
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha1 = "0.11"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["v4"] }
matroska-demuxer = "=0.8.1"
oxideav-core = "0.1"
oxideav-mp4 = "=0.0.11"
oxideav-sub-image = "=0.0.9"
flate2 = "1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
tl = "0.7.8"
encoding_rs = "0.8"
libc = "0.2"
unicode-normalization = "0.1"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The secure path to Diamond (punch, spray, identity, end-to-end encryption): ABT's shared
# abt-link (ABT owns it; move the rev to update).
abt-link = { git = "https://github.com/jonthomason/abt.git", rev = "b93dc879ba686e83e2db4f912fed4300a2a7bf71", default-features = false, features = ["host", "bronze"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }


[patch.crates-io]
matroska-demuxer = { path = "vendor/matroska-demuxer" }
