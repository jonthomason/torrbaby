[package]
name = "tbdirect"
version = "0.1.0"
edition = "2024"
description = "Torrbaby's direct connection, in the iPhone/iPad app: QUIC on the punched socket and a loopback proxy"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
doctest = false

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
sha2 = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# ipstack, with Torrbaby fixes (see vendor/ipstack and the comments marked Torrbaby).
ipstack = { path = "vendor/ipstack" }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
rcgen = "0.13"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
tbrendezvous = { path = "../../rendezvous" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# A panic ends only the task it happens in (one connection), not the packet tunnel
# extension: with "abort" any panic killed the whole extension (iOS: pluginFailed).
panic = "unwind"
strip = true

[workspace]
